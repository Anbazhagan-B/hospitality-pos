server:
  port: 8082

spring:
  application:
    name: enterprise-management-service
  datasource:
    url: jdbc:h2:mem:enterprisedb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # Short timeouts on purpose. A cache lookup that blocks for seconds is
      # worse than no cache at all - it turns a Redis problem into a latency
      # problem on the request path. The CacheErrorHandler in RedisCacheConfig
      # then falls through to the database.
      timeout: 500ms
      connect-timeout: 500ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 200ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        interceptor.classes: com.pos.common.logging.MdcProducerInterceptor
        # Bounds how long send() blocks resolving topic metadata. The 60s
        # default means a single unreachable broker parks the calling thread for
        # a minute. Publishing already runs off the request thread, so this only
        # caps how long a worker is tied up - but both defences matter.
        max.block.ms: 3000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000

jwt:
  secret: ${JWT_SECRET:MySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        # Health groups exist so an optional dependency cannot take the service
        # out of the load balancer. Redis is a cache with a fail-open error
        # handler - losing it means slower reads, not a broken service - so it
        # must not appear here. Without this, /actuator/health returns 503 when
        # Redis is unreachable, the readiness probe fails, and the pod is pulled
        # from the Service: the cache outage becomes a full outage.
        readiness:
          include: readinessState, db
        liveness:
          include: livenessState

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

pos:
  environment: ${POS_ENVIRONMENT:local}
  logging:
    slow-call-threshold-ms: ${POS_SLOW_CALL_MS:1000}
  cache:
    # Off by default so a developer with no Redis running still gets a working
    # service. Docker Compose and Kubernetes both set POS_CACHE_ENABLED=true.
    enabled: ${POS_CACHE_ENABLED:false}
    invalidation:
      enabled: ${POS_CACHE_ENABLED:false}
      topic: cache-invalidation

logging:
  level:
    com.pos: ${POS_LOG_LEVEL:INFO}
