server:
  port: 8083

spring:
  application:
    name: check-service
  datasource:
    url: jdbc:h2:mem:checkdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        # Attaches the current correlation id as a Kafka record header so the
        # kitchen-display consumer can continue the same trace. Without it the
        # trace stops dead at the broker.
        interceptor.classes: com.pos.common.logging.MdcProducerInterceptor
        # send() blocks resolving topic metadata before it returns its future,
        # for up to max.block.ms - 60 seconds by default. addItem publishes an
        # OrderEvent on the request thread, so an unreachable broker made every
        # "add item to check" hang for a minute and then time out, even though
        # the check had already been saved successfully. 3s is long enough to
        # tolerate a leader election and short enough that a server at a
        # terminal is not left waiting.
        max.block.ms: 3000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000

kafka:
  topics:
    order-events: order-events

jwt:
  secret: ${JWT_SECRET:MySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      # Explicit rather than relying on Spring Boot's Kubernetes auto-detection.
      # The rollout's liveness and readiness probes hit /actuator/health/liveness
      # and /readiness; without this those groups do not exist, return 404, and
      # the kubelet reads 404 as a failed probe -> CrashLoopBackOff.
      probes:
        enabled: true
  metrics:
    tags:
      # Lets a Prometheus query select one service's series without relying on
      # the job label, which differs between Compose and Kubernetes.
      application: ${spring.application.name}
    distribution:
      # REQUIRED by the canary analysis. Micrometer only publishes
      # http_server_requests_seconds_bucket when histogram output is enabled;
      # without it histogram_quantile() has no series to read and the p99
      # metric returns empty, which Argo Rollouts scores as inconclusive and
      # the rollout stalls rather than promoting or aborting.
      percentiles-histogram:
        http.server.requests: true
      # Bounding the range keeps bucket cardinality sane. A request slower than
      # 2s is already a failure for a POS terminal.
      minimum-expected-value:
        http.server.requests: 10ms
      maximum-expected-value:
        http.server.requests: 2s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    instances:
      checkService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50

pos:
  environment: ${POS_ENVIRONMENT:local}
  logging:
    slow-call-threshold-ms: ${POS_SLOW_CALL_MS:1000}

  check:
    # jpa (default) or dynamodb. Selecting the backend by configuration rather
    # than by code means a migration can be rolled back without a redeploy.
    store: ${POS_CHECK_STORE:jpa}

  dynamodb:
    table-name: ${POS_DYNAMODB_TABLE:pos-checks}
    region: ${AWS_REGION:ap-south-1}
    # Point at DynamoDB Local for development. Empty in AWS, where the SDK
    # resolves the real regional endpoint and credentials come from IRSA.
    endpoint: ${POS_DYNAMODB_ENDPOINT:}

logging:
  level:
    # INFO by default in every deployed environment. At DEBUG the logging aspect
    # emits request and response bodies for every call, which multiplies
    # Elasticsearch storage and puts raw user input into the index.
    # Override per-pod with POS_LOG_LEVEL when actively debugging.
    com.pos: ${POS_LOG_LEVEL:INFO}
