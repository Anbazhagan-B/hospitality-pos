server:
  port: 8086

spring:
  application:
    name: admin-panel-service
  datasource:
    url: jdbc:h2:mem:admindb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:MySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

pos:
  environment: ${POS_ENVIRONMENT:local}
  logging:
    slow-call-threshold-ms: ${POS_SLOW_CALL_MS:1000}

logging:
  level:
    com.pos: ${POS_LOG_LEVEL:INFO}
