global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'employee-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['employee-service:8081']

  - job_name: 'enterprise-management-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['enterprise-management-service:8082']

  - job_name: 'check-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['check-service:8083']

  - job_name: 'payment-gateway-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['payment-gateway-service:8084']

  - job_name: 'kitchen-display-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['kitchen-display-service:8085']

  - job_name: 'admin-panel-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['admin-panel-service:8086']

  - job_name: 'cook-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['cook-service:8087']
