# ---------------------------------------------------------------------------
# External Secrets Operator wiring.
#
# Replaces the plaintext Secret in configmap.yml. Nothing sensitive is in this
# file - it holds pointers to AWS Secrets Manager, and the operator resolves
# them at runtime using an IRSA-assumed role with no static credentials.
#
# Apply AFTER Terraform and AFTER the operator is installed:
#
#   helm install external-secrets external-secrets/external-secrets \
#     -n external-secrets --create-namespace \
#     --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=<external_secrets role arn>
#
# Two placeholders below must be substituted from Terraform outputs:
#
#   terraform -chdir=infrastructure/terraform output -raw jwt_secret_name
#   terraform -chdir=infrastructure/terraform output -raw rds_master_user_secret_arn
#
#   sed -e "s|__JWT_SECRET_NAME__|$(terraform ... output -raw jwt_secret_name)|" \
#       -e "s|__RDS_SECRET_ARN__|$(terraform ... output -raw rds_master_user_secret_arn)|" \
#       infrastructure/kubernetes/external-secrets.yml | kubectl apply -f -
#
# The RDS ARN is not deterministic because RDS appends a random suffix to
# secrets it manages, which is why it cannot simply be hardcoded here.
# ---------------------------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        # No access key anywhere. The operator's ServiceAccount is annotated
        # with an IRSA role, presents its projected OIDC token to STS, and
        # receives credentials valid for an hour.
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pos-secrets
  namespace: pos-system
spec:
  # Re-read hourly, so a rotated value reaches pods without a redeploy. Note
  # the pods themselves still need a restart to pick up a changed env var -
  # mounting the Secret as a volume instead makes rotation fully live.
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    # Produces a Kubernetes Secret literally named pos-secrets - the same name
    # the existing deployment manifests already reference via secretKeyRef, so
    # no deployment changes are required. configmap.yml's hardcoded Secret
    # block should be deleted once this is in place.
    name: pos-secrets
    creationPolicy: Owner

  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: __JWT_SECRET_NAME__
        property: JWT_SECRET

    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        # Secret created, owned and rotated by RDS itself - no human ever sees
        # this value and it is not in Terraform state.
        key: __RDS_SECRET_ARN__
        property: password
