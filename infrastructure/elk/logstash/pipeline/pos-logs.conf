# ---------------------------------------------------------------------------
# Logstash pipeline for POS application logs
#
#   Filebeat -> [this] -> Elasticsearch
#
# Responsibilities kept here rather than in the application:
#   - parsing the JSON payload the Logback encoder produced
#   - normalising field names and types so the index template can map them
#   - routing application logs and infrastructure logs to different indices
#   - tagging security-relevant events for alerting
# ---------------------------------------------------------------------------

input {
  beats {
    port => 5044
  }
}

filter {

  # Filebeat delivers the raw stdout line in [message]. For our services that
  # line is the JSON object produced by LogstashEncoder, so parse it in place.
  # Anything that is not JSON (a JVM crash, a base-image message) falls through
  # with _jsonparsefailure and is still kept - a log you cannot parse is far
  # more useful than a log you dropped.
  if [message] =~ /^\s*\{.*\}\s*$/ {
    json {
      source => "message"
      skip_on_invalid_json => true
      # The parsed object contains its own "message" field; letting it overwrite
      # the raw line is intentional and keeps documents small.
      target => "app"
    }

    if [app] {
      ruby {
        code => '
          app = event.get("app")
          app.each { |k, v| event.set(k, v) } if app.is_a?(Hash)
          event.remove("app")
        '
      }

      # The encoder emits UTC ISO-8601. Using it as the document timestamp means
      # Kibana orders events by when they happened, not when they were shipped.
      date {
        match => [ "@timestamp", "ISO8601" ]
        target => "@timestamp"
      }

      mutate {
        # durationMs travels through MDC as a string; without this it maps as
        # text in Elasticsearch and cannot be averaged or charted.
        convert => {
          "durationMs" => "integer"
          "httpStatus" => "integer"
        }
        remove_field => [ "agent", "ecs", "input", "log", "host", "@version" ]
      }
    }
  }

  # ---- Classification used by dashboards and alerts ----------------------

  if [level] == "ERROR" {
    mutate { add_tag => [ "error" ] }
  }

  if [errorType] in [ "AUTH_FAILED", "ACCESS_DENIED" ] {
    mutate { add_tag => [ "security" ] }
  }

  if [durationMs] and [durationMs] > 1000 {
    mutate { add_tag => [ "slow" ] }
  }

  # The payment path is in PCI audit scope; tagging it lets those documents be
  # routed to a separate index with its own retention and access control.
  if [service] == "payment-gateway-service" {
    mutate { add_tag => [ "pci-scope" ] }
  }

  # ---- Last line of defence on sensitive data ----------------------------
  # SensitiveDataMasker in the application is the primary control. This is a
  # backstop for anything logged by a third-party library that never passes
  # through our aspect. Defence in depth: once a PAN is indexed, removing it
  # means reindexing.
  mutate {
    gsub => [
      "message", "\b(?:\d[ -]?){12,18}\d\b", "[REDACTED-CARD]",
      "message", "(?i)(password|secret|token|cvv)\s*[=:]\s*\S+", "\\1=[REDACTED]"
    ]
  }
}

output {

  # Application logs: one index per day, aliased and rolled over by ILM.
  if [service] {
    elasticsearch {
      hosts => [ "${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}" ]
      index => "pos-logs-%{[service]}-%{+YYYY.MM.dd}"
      # Must match the template registered by bootstrap-elasticsearch.sh
      template_name => "pos-logs"
      manage_template => false
    }
  } else {
    # Infrastructure and unparsed container output, kept separate so it cannot
    # dilute the application index or its field mappings.
    elasticsearch {
      hosts => [ "${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}" ]
      index => "pos-infra-%{+YYYY.MM.dd}"
      manage_template => false
    }
  }

  # Uncomment while debugging the pipeline itself.
  # stdout { codec => rubydebug }
}
